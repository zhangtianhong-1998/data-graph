# Copy to agent.local.yaml, then set agent_config: agent.local.yaml in the run YAML.
# Paths resolve relative to the run YAML. Only the Harness runtime is supported.
framework: deepseek_harness
name: goal-driven-graph
llm:
  # metadata_only permits catalog/documents; in_environment allows source probes.
  # approved_external requires authorization to send samples outside the environment.
  mode: metadata_only
  base_url: https://your-model-gateway.example/v1
  model: your-deployed-model
  api_key: ""
  api_key_env: LIGHTGRAPH_API_KEY
  allow_insecure_http: false
  timeout_seconds: 600
  # Hard admission uses the native token estimate, including tools and history.
  # Provider usage calibrates later estimates; this is not an exact tokenizer.
  max_prompt_tokens: 1048576
  max_output_tokens: 65536
  context_window_tokens: 1114112
  # Active context is compacted before the hard limit; full history stays on disk.
  # null disables automatic compaction. Input/context null disables its input cap.
  working_context_tokens: 32768
  retries: 1
  # Counts physical model requests, including retries and compaction summaries.
  # null removes this call cap; zero prevents model calls. No cumulative token cap.
  max_calls: 240
