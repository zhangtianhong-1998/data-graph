<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT 知识图谱</title>
<style>*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#f4f6f8;color:#253342}header{background:#153c50;color:white;padding:24px 32px}h1{font-size:24px;margin:0 0 8px}nav{display:flex;gap:12px;padding:18px 32px;flex-wrap:wrap}input,select,button{padding:9px;border:1px solid #ccd6de;border-radius:6px;background:white}main{display:grid;grid-template-columns:1fr 360px;gap:16px;margin:0 32px}#canvas,aside{background:white;border:1px solid #d8e0e5;border-radius:10px;height:68vh;overflow:auto}svg{min-width:800px}aside{padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}#list{margin:20px 32px}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e8eb}tr:hover{background:#eef7fb;cursor:pointer}.hint{color:#63798c;font-size:13px;margin:10px 32px}circle{cursor:pointer;stroke:white;stroke-width:2}line{stroke:#b7c9d4;stroke-width:1.2}text{font-size:12px;fill:#243b4b}button{cursor:pointer}@media(max-width:900px){main{grid-template-columns:1fr}aside{height:220px}}</style>
<header><h1>ICT 知识图谱</h1><div id="summary"></div></header>
<nav><input id="search" placeholder="搜索名称、编码或别名"><select id="layer"><option value="business">业务知识</option><option value="metadata">物理元数据</option><option value="provenance">来源文档</option><option value="all">全部</option><option value="claims">分析主张</option></select><select id="status"><option value="all">全部状态</option><option value="accepted">已确认</option><option value="candidate">候选</option><option value="unresolved">未决</option></select><button id="reset">清除筛选</button></nav>
<main><div id="canvas"><svg id="svg"></svg></div><aside id="detail">点击节点查看属性、状态及来源支持。</aside></main><p class="hint">图中只显示当前导出范围内可见的知识。候选和未决不代表业务已确认；候选连线用虚线。连线的具体含义见关系表；画布最多绘制 3,000 条连线，关系表保留全部可见关系。</p><section id="list"></section>
<script>const graph=/*GRAPH_DATA*/{};const $=id=>document.getElementById(id);const id=n=>n.id||n.entity_id;const ns='http://www.w3.org/2000/svg';
function el(t,a={},text){const x=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(text!==undefined)x.textContent=text;return x}
function label(n){return n.kind==='Column'?(n.properties?.qualified_name||n.label):n.label||id(n)}
function detail(n){const supports=(graph.supports||[]).filter(s=>(n.support_ids||[]).includes(s.id));$('detail').textContent=JSON.stringify({...n,support_details:supports,...(graph.provenance_location?{source_details:'完整来源支持保存在同目录的 graph.json，或通过工作台按需查看。'}:{})},null,2)}
function draw(){const term=$('search').value.toLowerCase(),layer=$('layer').value,status=$('status').value;if(layer==='claims'){const claims=(graph.claims||[]).filter(c=>(status==='all'||c.status===status)&&(!term||JSON.stringify(c).toLowerCase().includes(term)));$('svg').replaceChildren();$('summary').textContent=`${claims.length} 条分析主张（保留模态和条件）`;const table=document.createElement('table');claims.forEach(c=>{const r=document.createElement('tr');[c.subject,c.predicate,c.object,c.modality,JSON.stringify(c.conditions)].forEach(v=>{const td=document.createElement('td');td.textContent=v;r.append(td)});r.onclick=()=>detail(c);table.append(r)});$('list').replaceChildren(table);return}let nodes=(graph.nodes||[]).filter(n=>(layer==='all'||n.layer===layer)&&(status==='all'||n.status===status)&&(!term||JSON.stringify(n).toLowerCase().includes(term)));let ids=new Set(nodes.map(id));const edges=(graph.edges||[]).filter(e=>ids.has(e.source)&&ids.has(e.target));$('summary').textContent=`当前视图 ${nodes.length} 个节点 · ${edges.length} 条关系 · ${graph.claims?.length||0} 条文档主张`;
const svg=$('svg');svg.replaceChildren();const cols=Math.max(4,Math.ceil(Math.sqrt(nodes.length))),width=Math.max(800,cols*170),height=Math.max(500,Math.ceil(nodes.length/cols)*120);svg.setAttribute('width',width);svg.setAttribute('height',height);const pos=new Map(nodes.map((n,i)=>[id(n),[85+(i%cols)*170,60+Math.floor(i/cols)*120]]));edges.slice(0,3000).forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target),l=el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1]});l.setAttribute('stroke-dasharray',e.status==='accepted'?'none':'5 4');l.append(el('title',{},e.relation+' · '+e.status));l.addEventListener('click',()=>detail(e));svg.append(l)});nodes.forEach(n=>{const [x,y]=pos.get(id(n)),g=el('g'),c=el('circle',{cx:x,cy:y,r:18,fill:n.status==='accepted'?'#2c8f9e':n.status==='candidate'?'#ddaa48':'#b27777'});g.append(c,el('text',{x,y:y+36,'text-anchor':'middle'},label(n).slice(-21)));g.append(el('title',{},label(n)));g.addEventListener('click',()=>detail(n));svg.append(g)});
const table=document.createElement('table');const tr=document.createElement('tr');['起点','关系','终点','状态'].forEach(x=>{const th=document.createElement('th');th.textContent=x;tr.append(th)});table.append(tr);const names=new Map(nodes.map(n=>[id(n),label(n)]));edges.forEach(e=>{const r=document.createElement('tr');[names.get(e.source),e.relation,names.get(e.target),e.status].forEach(x=>{const td=document.createElement('td');td.textContent=x;r.append(td)});r.addEventListener('click',()=>detail(e));table.append(r)});$('list').replaceChildren(table)}
['search','layer','status'].forEach(x=>$(x).addEventListener('input',draw));$('reset').onclick=()=>{$('search').value='';$('layer').value='business';$('status').value='all';draw()};draw();</script></html>
