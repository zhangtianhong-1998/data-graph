name: Cross-platform tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Run 41374038459: Windows 3.11 reached 86% after 32 minutes of tests,
    # then hit the 35-minute job limit. Include install/preflight/cleanup time
    # and runner variability without skipping tests or weakening SQLite writes.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check credential retention lifecycle
        run: python -m pytest -q src/lightgraph/tests/test_web_credentials.py
      - name: Check experiment recovery and portability
        run: python -m pytest -q src/lightgraph/tests/test_evaluation.py src/lightgraph/tests/test_frozen_resume.py src/lightgraph/tests/test_frozen_portability.py src/lightgraph/tests/test_recovery_evidence.py src/lightgraph/tests/test_reference_display.py src/lightgraph/tests/test_submission_scope_options.py src/lightgraph/tests/test_relation_foundation_wait.py
      - name: Run complete test suite
        # End a stalled suite before the job deadline, leaving cleanup time.
        timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 55 || 17 }}
        run: python -m pytest -q --durations=15 -o faulthandler_timeout=90

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/workbench/package-lock.json
      - run: npm --prefix src/workbench ci
      - run: npm --prefix src/workbench test
      - run: npm --prefix src/workbench run build
