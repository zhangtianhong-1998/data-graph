[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-lightgraph"
version = "1.0.0"
description = "Read-only knowledge graph extraction from Gauss, MySQL, Excel, CSV and Markdown, with a Vue workbench"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "sqlglot>=26,<29",
  "openpyxl>=3.1,<4", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4",
  "jsonschema>=4,<5", "openai==3.35.1",
  "mcp>=1.13,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "PyMySQL[rsa]>=1.2.3,<2", "cryptography>=44,<51", "numpy>=1.26,<3",
  "pyarrow>=18,<24",
]

[project.optional-dependencies]
test-harness = ["pytest>=8,<9"]
test = ["pytest>=8,<9"]
embedding = ["torch>=2.3,<3", "transformers>=4.51,<5", "sentence-transformers>=3,<5"]

[project.scripts]
lightgraph = "lightgraph.cli:main"
lightgraph-harness = "lightgraph.construction.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lightgraph*"]
exclude = ["lightgraph.tests*"]

[tool.setuptools.package-data]
lightgraph = ["presentation/*.html", "schemas/*.json", "construction/runtime/*.mjs", "construction/skills/build-graph/*.md", "construction/skills/build-graph/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["src/lightgraph/tests"]
addopts = "-ra"
