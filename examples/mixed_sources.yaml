# Synthetic files only. Prepare the Excel package once from the project root:
# lightgraph sample examples/sample --rows 100
# Then: lightgraph discover examples/mixed_sources.yaml
# This runs without a database connection or paid model. Statistical matches
# remain candidates until the workflow verifies the business relationship.
isolation_domain: mixed_files_demo
sources:
  - id: workbook
    kind: excel_workbook
    path: sample/input.xlsx
    header_row: 1
  - id: reference_csv
    kind: csv_file
    path: mixed_reference.csv
    table_name: item_reference
    schema_name: public
    encoding: utf-8
    delimiter: ","
    header: true
    header_row: 1
    null_values: ["NULL"]
    # Preserve codes and whitespace verbatim; no number or encoding guessing.
    type_inference: text
documents:
  - sample/data_description.md
  - sample/analysis.md
  - mixed_context.md
output_dir: ../runs/mixed_files
scopes: [A, B, public]
document_scopes: [A, B]
goal:
  purpose: 验证 Excel 和 CSV 混合接入，并发现租户范围内的报表项目引用候选
  source_scope: [workbook.public.report_item, reference_csv.public.item_reference]
  observation_values: false
model:
  mode: disabled
max_working_bytes: 33554432
max_db_queries: 240
limits:
  max_result_rows: 20000
  max_batch_rows: 5000
  max_batch_bytes: 65536
