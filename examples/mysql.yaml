isolation_domain: customer
goal:
  purpose: 构建经营分析的指标、维度和组织结构，不抽取逐笔业务金额
  exclude: [具体业务观测值]
sources:
  - id: mysql
    kind: mysql_database
    # mysql://user:percent-encoded-password@host:3306/finance
    # Non-loopback connections verify TLS certificates and hostname by default.
    dsn_env: LIGHTGRAPH_MYSQL_DSN
    # Run connect-check from the repository root before instance access:
    # lightgraph connect-check examples/mysql.yaml --verify-runtime --output mysql-capabilities.yaml
    # JSON emitted by connect-check is valid YAML; either form is accepted.
    capability_manifest: ../mysql-capabilities.yaml
    # MySQL uses database.table; no hard-coded public schema is added.
    allowed_tables: [finance.report_item, finance.report_tree]
    allowed_columns:
      finance.report_item: [tenant_id, item_code, item_name, item_en_name, definition]
      finance.report_tree: [tenant_id, l1_code, l1_name, l2_code, l2_name, l3_code, l3_name]
documents: []
rules: []
output_dir: ../runs/mysql
scopes: [public]
deployment_retention_verified: false
model:
  mode: disabled
