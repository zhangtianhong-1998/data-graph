[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-lightgraph"
version = "1.0.0"
description = "Read-only, rule-driven knowledge graph extraction from Gauss, Excel and Markdown"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "sqlglot>=26,<29", "openpyxl>=3.1,<4", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4,<5"]

[project.scripts]
lightgraph = "lightgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lightgraph*"]
exclude = ["lightgraph.tests*"]

[tool.setuptools.package-data]
lightgraph = ["presentation/*.html", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["src/lightgraph/tests"]
addopts = "-ra"
